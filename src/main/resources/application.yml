
spring:
  application:
    name: sindik-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sindik}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000   # 24h
    clock-skew-seconds: 60
